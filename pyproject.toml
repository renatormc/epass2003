[project]
name = "epass2003"
version = "0.1.0"
description = "Aplicativo para assinar PDFs (PAdES) com o token ePass2003 (Soluti/Feitian) no Linux"
readme = "README.md"
authors = [
    { name = "renatormc", email = "renatomartinsrmc@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "pyhanko[image-support,pkcs11]>=0.37.0",
    "pyside6>=6.8",
]

[project.scripts]
epass2003 = "epass2003:main"

[project.gui-scripts]
epass2003-assinador = "epass2003.app:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
